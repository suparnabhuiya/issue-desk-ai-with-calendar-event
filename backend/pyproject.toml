[project]
name = "issue-desk-backend"
version = "0.1.0"
description = "FastAPI backend for the Issue Desk React application"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0.0",
    "fastapi[standard]>=0.136.3",
    "langchain>=1.3.4",
    "langchain-groq>=1.1.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
